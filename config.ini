; ===========================================================================
;  Media Pipeline - Settings
; ===========================================================================
;
;  HOW THIS FILE WORKS
;  -------------------
;  - This is the ONLY file you need to edit.
;  - Each setting is "Name = Value". Change the value after the "=".
;  - Lines starting with ";" or "#" are notes and are ignored.
;  - After saving, double-click "Restart Watcher.bat" to apply your changes.
;
;  PRESETS
;  -------
;  A preset is a named recipe. Each one gets its own drop folder:
;
;      D:\MediaPipeline\<preset>\<workspace>\input
;
;  Drop files in, processed copies come out in the matching "output" folder,
;  and the originals move to "original". Workspaces (LC, MD, YL, PL, general)
;  keep different clients or projects apart.
;
;  Copy counts are separate for video and images, so one folder can take a
;  mixed batch of clips and photos and treat each correctly.
;
;  A preset only lists what it wants to change. Anything it does not mention
;  falls back to the [Video] and [Images] defaults further down. So making a
;  preset produce more copies is usually a one-line edit.
;
;  Delete any preset you do not use. Add one by copying a block and renaming
;  it. The folders are created automatically on the next restart.
; ===========================================================================


[General]
; Where all the watcher's folders live. Default: D:\MediaPipeline
PipelineRoot = D:\MediaPipeline


; ===========================================================================
;  PRESETS
; ===========================================================================

; The everyday preset: many differentiated copies of whatever you drop in.
[preset bulk]
VideoCopies = 20
ImageCopies = 20

; One cleaned copy per video. Ignores images.
[preset video-clean]
VideoCopies = 1
ImageCopies = 0

; One cleaned copy per image. Ignores video.
[preset image-clean]
VideoCopies = 0
ImageCopies = 1

; Many variants from a single photo.
[preset image-bulk]
VideoCopies = 0
ImageCopies = 50

; Every source file gets its own output folder holding its copies.
[preset sets]
VideoCopies = 10
ImageCopies = 10
Grouping = PerSource
SizeCapMB = 0

; Treats the whole input folder as one batch and produces SetCount complete
; sets, each containing one processed copy of every source file.
[preset sets-batch]
VideoCopies = 1
ImageCopies = 1
Grouping = PerSet
SetCount = 10
Batch = PerGroup
SizeCapMB = 0

; Same as setbatch, plus a manifest.json describing every generated file.
[preset asset-store]
VideoCopies = 1
ImageCopies = 1
Grouping = PerSet
SetCount = 18
Batch = PerGroup
SizeCapMB = 0
Manifest = true
; Deliberately tiny so each copy differs without changing length noticeably.
MinTrimMs = 10
MaxTrimMs = 40

; Splits long videos into segments first, then makes VideoCopies of each.
[preset video-long]
VideoCopies = 3
ImageCopies = 0
Segment = true
; Long videos tolerate slightly lower quality for a big size saving.
NvencCq = 28
AmfQp = 26


; ===========================================================================
;  PRESET OPTIONS REFERENCE
; ===========================================================================
;
;  VideoCopies              Outputs per source video. 0 ignores video.
;  ImageCopies              Outputs per source image. 0 ignores images.
;  CopiesAlternate          If set, consecutive files alternate between the
;                           count above and this one, so a run of files does
;                           not all produce the same number of outputs.
;
;  Grouping                 Flat       all outputs in one folder (default)
;                           PerSource  one folder per source file
;                           PerSet     SetCount folders, each a complete set
;  SetCount                 How many sets, when Grouping = PerSet.
;
;  Batch                    PerFile    process each file as it settles (default)
;                           PerGroup   wait for the whole folder, then process
;                                      it as one batch
;
;  Segment                  true splits long videos into segments first.
;  Manifest                 true writes a manifest.json next to the output.
;  Normalize                true converts .mov and .heic before processing.
;                           Default true; there is rarely a reason to disable.
;
;  OnFailure                PreservePartial  keep whatever finished (default
;                                            for Flat)
;                           DeleteFiles      remove the outputs of a failed run
;                           DeleteContainer  remove the whole output folder
;                                            (default for grouped presets)
;  Parallel                 OverFiles   process several files at once (default)
;                           Sequential  one at a time
;
;  Enabled                  false switches a preset off without deleting it.
;
;  Any setting from [Video] or [Images] below can also be set on a preset,
;  and overrides the default for that preset only.
; ===========================================================================


[Video]
; Lower CRF = better quality + bigger files. Roughly 18 (high) to 28 (small).
Crf = 24

; libx264 speed/quality tradeoff: ultrafast, fast, medium, slow, veryslow.
X264Preset = medium

; Audio quality. e.g. 96k, 128k, 192k.
AudioBitrate = 128k

; Videos are shrunk so their width is at most this many pixels (never enlarged).
MaxWidth = 1080

; Cap each output video at this many MB. 0 = no cap.
SizeCapMB = 8
; If a video still will not fit, shrink width to this as a fallback.
SizeCapFallbackMaxWidth = 720

; Each video copy trims a tiny random amount off the end, in milliseconds.
MinTrimMs = 15
MaxTrimMs = 95

; Target and minimum length (seconds) per segment, for presets with Segment = true.
SegmentTargetSeconds = 15
SegmentMinSeconds = 11

; GPU acceleration. The watcher tries NVIDIA, then AMD, then CPU, and only
; uses a GPU encoder if a real test encode succeeds. Safe to leave both on.
PreferNvenc = true
PreferAmf = true

; NVIDIA (NVENC) tuning. Lower CQ = better quality.
NvencPreset = p4
NvencCq = 26

; AMD (AMF) tuning. AmfQuality: speed, balanced, or quality. Lower QP = better.
AmfQuality = balanced
AmfQp = 24

; GPU bitrate ceiling as a fraction of the size-target bitrate on the first
; encode, which helps land under the size cap in one pass. Advanced.
MaxrateScale = 0.92


[Images]
; How many files are processed at the same time. "auto" picks a safe number
; based on your CPU, or set a whole number like 4.
ImageProcessingConcurrency = 12

; Every image copy gets a tiny random crop, scaled back to the original size,
; so the copies differ without looking different. In permille (parts per
; 1000): 5 = 0.5%, 20 = 2%. Keep these small.
CropMinPermille = 5
CropMaxPermille = 20

; Images come out as .jpg. Lower number = higher quality and larger files.
; 4 is a high-quality middle ground for photos.
JpegQuality = 4

; Quality for sources that had to be decoded first (HEIC). That round trip is
; already a re-encode, so it gets a little more headroom.
ConvertedJpegQuality = 12

; Compression level for the rare preset configured to emit PNG. 0-9.
PngCompressionLevel = 6


[Upload]
; Where uploads land on the remote. A workspace folder is created inside it, so
; a file staged in LC\sync arrives on the remote under sync\LC.
RemoteDirectory = D:\MediaPipeline\sync

; Remove the local file once the remote copy has been read back and confirmed
; the right size. Off by default, because it cannot be undone.
DeleteAfterUpload = false

; Large files are split into chunks this size before sending. Smaller chunks
; retry faster on a flaky link; larger ones have less overhead.
ChunkSizeMB = 256

; How many chunks are sent at the same time.
ParallelChunks = 4


[Timing]
; A file must stop changing for this many seconds before it is processed
; (lets browser downloads finish).
StableSeconds = 3

; Give up waiting on a single file after this many seconds.
TimeoutSeconds = 600

; How often the watcher checks the input folders, in seconds.
PollSeconds = 2


[Archive]
; Move old output files into an "archive" folder so output folders stay tidy.
ArchiveEnabled = true

; Output files older than this many hours get archived.
ArchiveAgeHours = 15

; How often (minutes) the watcher checks for files to archive.
ArchiveCheckIntervalMinutes = 30

; Delete retained entries this many days after they were created. Applies to
; archive, original, failed, work, sync and .sync-parts folders. The images
; preset is excluded. Set to 0 to disable retention cleanup.
AssetRetentionDays = 5
