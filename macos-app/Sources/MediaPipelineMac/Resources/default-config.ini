[General]
PipelineRoot = ~/MediaPipeline

[Video]
Crf = 24
X264Preset = medium
AudioBitrate = 128k
MaxWidth = 1080
SizeCapMB = 8
SizeCapFallbackMaxWidth = 720
MinTrimMs = 15
MaxTrimMs = 95
SegmentTargetSeconds = 15
SegmentMinSeconds = 11
PreferVideoToolbox = true
VideoToolboxBitrateKbps = 6000
PreferNvenc = false
PreferAmf = false

[Images]
ImageProcessingConcurrency = auto
CropMinPermille = 5
CropMaxPermille = 20
JpegQuality = 4
ConvertedJpegQuality = 12
PngCompressionLevel = 6

[Timing]
StableSeconds = 3
TimeoutSeconds = 600
PollSeconds = 2

[Archive]
ArchiveEnabled = true
ArchiveAgeHours = 15
ArchiveCheckIntervalMinutes = 30
AssetRetentionDays = 5

[Upload]
RemoteName = heatup-remote
RemoteSftpPartsRoot = /D:/MediaPipeline/.sync-parts
RemotePartsRoot = D:\MediaPipeline\.sync-parts
RemoteDirectory = D:\MediaPipeline\sync
RemoteSshHost = heatup-remote
RemoteSshPort = 2222
RemoteSshKeyFile = ~/.ssh/heatup_remote_debug_ed25519
DeleteAfterUpload = false
ChunkSizeMB = 256
ParallelChunks = 4

[preset bulk]
VideoCopies = 8
ImageCopies = 8
CopiesAlternate = 7

[preset video-clean]
VideoCopies = 1
ImageCopies = 0

[preset image-clean]
VideoCopies = 0
ImageCopies = 1

[preset image-bulk]
VideoCopies = 0
ImageCopies = 20

[preset sets]
VideoCopies = 10
ImageCopies = 10
Grouping = PerSource
SizeCapMB = 0

[preset sets-batch]
VideoCopies = 1
ImageCopies = 1
Grouping = PerSet
SetCount = 10
Batch = PerGroup
SizeCapMB = 0

[preset asset-store]
VideoCopies = 1
ImageCopies = 1
Grouping = PerSet
SetCount = 15
Batch = PerGroup
SizeCapMB = 0
Manifest = true
MinTrimMs = 10
MaxTrimMs = 40

[preset video-long]
VideoCopies = 3
ImageCopies = 0
